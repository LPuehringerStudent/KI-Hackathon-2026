name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Data extraction sanity (exits 0 on plausible counts)
        run: python3 tools/extract_innenstadt.py

      - name: Project import / GDScript parse check
        run: godot --headless --path game/godot --quit

      - name: Core logic suites
        run: godot --headless --path game/godot -s res://tests/run_tests.gd

      - name: Data + map suites
        run: godot --headless --path game/godot -s res://tests/run_data_tests.gd

      - name: Panel suite
        run: godot --headless --path game/godot -s res://tests/run_panel_tests.gd

      - name: Integration suite
        run: godot --headless --path game/godot -s res://tests/run_integration_tests.gd

      - name: Menu suite
        run: godot --headless --path game/godot -s res://tests/run_menu_tests.gd

      - name: Style suite (capture checks self-skip headless)
        run: godot --headless --path game/godot -s res://tests/run_style_tests.gd

      - name: Proxy client suite (mock server, no keys needed)
        run: python3 tools/check_proxy_client.py godot
